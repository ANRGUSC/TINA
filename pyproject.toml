[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tina-reproduction"
version = "1.0.0"
description = "Reproduction package for A Theory of Information Architecture for Networked Decisions"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Scott Moeller"},
  {name = "Bhaskar Krishnamachari"},
]
dependencies = [
  "matplotlib==3.10.8",
  "networkx==3.6.1",
  "numpy==2.4.3",
  "PyYAML==6.0.3",
  "scipy==1.17.1",
]

[tool.setuptools.packages.find]
include = ["numerics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
